[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funpay-analytics"
version = "0.2.0"
description = "Analytics engine, scraper and financial lake for FunPay marketplace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "curl_cffi>=0.7.0",
    "funpayparsers>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
funpay-analytics = "funpay_analytics.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
funpay_analytics = ["storage/migrations/*.sql"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length/formatter)
    "E402",  # module level import not at top of file
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E701", "E702", "E741", "F841"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

